<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Portfolio Map</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="spatial-viewport" aria-label="Interactive portfolio map"></div>
    <div class="map-explore-hint" role="note" aria-label="Scroll down for projects">
      <p class="map-explore-hint__line">scroll for projects  or explore the collage</p>
      <div class="map-explore-hint__arrow" aria-hidden>↓</div>
    </div>
    <!-- SVG filter for animated water ripple on the waterfall -->
    <svg class="water-filter-defs" aria-hidden="true">
      <defs>
        <filter id="water-ripple" color-interpolation-filters="sRGB" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence id="water-turbulence" type="fractalNoise" baseFrequency="0.012 0.038" numOctaves="3" seed="4" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <script src="./script.js"></script>
  </body>
</html>
